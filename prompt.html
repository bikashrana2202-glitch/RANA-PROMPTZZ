<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompts - AllPromptZ</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <nav>
    <h1>AllPromptZ</h1>
  </nav>
</header>

<section class="prompt-page">

<h2>Trending AI Prompts</h2>

<input type="text" id="searchInput" placeholder="Search prompts...">

<div class="prompt-box">

<h3>YouTube Script Prompt</h3>

<p>
Write a viral YouTube script on motivation with emotional storytelling.
</p>

<button onclick="copyPrompt(this)">
Copy Prompt
</button>

</div>

<div class="prompt-box">

<h3>Instagram Caption Prompt</h3>

<p>
Create 10 luxury Instagram captions for travel photos.
</p>

<button onclick="copyPrompt(this)">
Copy Prompt
</button>

</div>

</section>

<script src="js/app.js"></script>

</body>
</html>
