<!DOCTYPE html>
<html>
<head>
<title>AllPromptZ</title>

<style>

body{
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.card{
width:350px;
background:#1b1b1b;
border-radius:20px;
overflow:hidden;
}

.card img{
width:100%;
height:400px;
object-fit:cover;
}

.content{
padding:20px;
color:white;
}

.prompt{
background:#000;
padding:15px;
border-radius:10px;
margin-top:10px;
color:#00ffcc;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#00ffcc;
border:none;
border-radius:10px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

 <img src="images/girl.jpg.png">

<div class="content">

<h2>Viral TikTok AI Prompt</h2>

<div class="prompt" id="promptText">

ultra realistic girl, black halter top, baggy jeans, lake view, korean face, sunglasses, aesthetic pose, soft cinematic light, tiktok style, capcut ai, DSLR, 8k 3 pose

</div>

<button onclick="copyPrompt()">
Copy Prompt
</button>

</div>

</div>

<script>

function copyPrompt(){

let text =
document.getElementById("promptText").innerText;

navigator.clipboard.writeText(text);

alert("Copied 🔥");

}

</script>

</body>
</html>
